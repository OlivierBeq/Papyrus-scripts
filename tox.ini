[tox]
envlist =
    pyroma
    ruff
    tests
requires = tox

[testenv:tests]
commands =
    pytest tests/
conda_deps=
    rdkit
    openbabel
    pandas
deps =
    pytest
conda_channels=
    conda-forge
    rdkit
description = Run tests to check code validity.

[testenv:pyroma]
commands =
    pyroma .
deps =
    pyroma
skip_install = true
description = Make sure pyproject.toml is properly written out.

[testenv:ruff]
skip_install = true
deps =
    ruff
commands =
    ruff check src tests
description = Lint with Ruff (replaces flake8 + isort + pep8-naming + pydocstyle + bandit + bugbear + ...); config lives in pyproject.toml.
