[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrus_scripts"
dynamic = ["version"]
description = "A collection of scripts to handle the Papyrus bioactivity dataset"
requires-python = ">=3.10"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
    { name = "Olivier J. M. Béquignon", email = "olivier.bequignon.maintainer@gmail.com" },
    { name = "Brandon J. Bongers"},
    { name = "Willem Jespers"},

]
maintainers = [
    { name = "Olivier J. M. Béquignon", email = "olivier.bequignon.maintainer@gmail.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "bioactivity data",
    "QSAR",
    "proteochemometrics",
    "cheminformatics",
    "modelling",
    "machine learning",
]
dependencies = [
    "numpy>=2.0.0",
    "pandas",
    "polars",
    "rdkit",
    "requests",
    "tqdm",
    "mordred",
    "scikit-learn",
    "xgboost",
    "pystow",
    "prodec",
]

[project.urls]
Homepage = "https://github.com/OlivierBeq/Papyrus-scripts"

[project.scripts]
papyrus = "papyrus_scripts.cli:main"

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
]
testing = [
    "pytest",
    "parameterized",
]

[tool.setuptools.dynamic]
version = { attr = "papyrus_scripts.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json"]
